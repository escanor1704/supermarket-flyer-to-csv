# Settings of the flyer pipeline - change things HERE, not inside the code

stores: [kaufland, netto]   # the stores the pipeline reads, in this order. The FIRST one is the main store:
                            # if it fails, the run stops. Another store that fails is only skipped that week.
data_folder: data           # all data folders are inside this folder
keep_weeks: 4               # how many weeks of original flyer PDFs to keep (older ones are deleted)