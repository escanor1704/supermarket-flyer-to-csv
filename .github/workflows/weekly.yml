# weekly.yml - the weekly flyer pipeline on GitHub's computers (my PC can be off)
#
# How it works:   Build -> Test -> Deliver   (3 boxes on the run page, each on its own fresh computer)
#   when:     every Sunday 06:07 Berlin time, or the "Run workflow" button
#   Build     get the code, install the packages
#   Test      the quick tests - one fails = stop, nothing is stored
#   Deliver   run.py makes the new week's file, the tests check it, then it goes to Backblaze B2 as weekly/offers_<week>.csv
#   A push of new code only runs Build + Test (Deliver shows as "skipped").
#   The Backblaze keys come from GitHub Secrets (B2_KEY_ID, B2_APP_KEY) - never type them into this file.
#
# Tried and tuned:
#   - it was one big "weekly" box -> split into Build, Test, Deliver, so I can see where it broke
#   - Backblaze said "Seed signature is invalid" -> fixed with the two checksum lines below and a new key without spaces
#   - first it downloaded offers.csv from Backblaze to add to it (403 error) -> now it only stores, one file per week

name: Weekly flyer pipeline

on:
  schedule:
    - cron: "7 6 * * 0"              # minute 7, hour 6, every Sunday (0)
      timezone: "Europe/Berlin"
  workflow_dispatch:                  # adds the "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: read                      # GitHub only reads your code, nothing is written back

concurrency:
  group: weekly-flyer-pipeline        # never two runs at the same time
  cancel-in-progress: false

jobs:
  # ---------------- BOX 1: BUILD ----------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Python (same version as on your PC)
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the packages
        run: python -m pip install -r requirements.txt "pytest>=9,<10"

  # ---------------- BOX 2: TEST ----------------
  test:
    name: Test
    needs: build                      # starts only if Build worked
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Python (same version as on your PC)
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the packages
        run: python -m pip install -r requirements.txt "pytest>=9,<10"

      - name: Quick tests
        run: python -m pytest -v tests/test_quick.py

  # ---------------- BOX 3: DELIVER ----------------
  deliver:
    name: Deliver
    needs: test                       # starts only if Test worked
    if: github.event_name != 'push'   # not when you only push code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # ----- YOUR VALUES (not secret) -----
      B2_BUCKET: rohith-flyer-offers
      B2_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      AWS_DEFAULT_REGION: us-east-005
      # ----- YOUR KEYS: they come from GitHub Secrets - never type the keys into this file -----
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
      # send files the normal way (Backblaze does not accept the new "chunked" way of the AWS tool)
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Python (same version as on your PC)
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the packages
        run: python -m pip install -r requirements.txt "pytest>=9,<10"

      - name: Make the new week's offers
        run: python run.py

      - name: Test the new weekly file before storing it
        run: python -m pytest -v tests/test_quick.py

      - name: Store this week's offers in Backblaze B2
        run: |
          WEEK=$(cat data/current_week.txt)
          aws s3 cp "data/output/offers_$WEEK.csv" "s3://$B2_BUCKET/weekly/offers_$WEEK.csv" --endpoint-url "$B2_ENDPOINT"

      - name: Show the quality report on the run page
        if: always()
        run: |
          if [ -f logs/quality_report.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat logs/quality_report.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the log files for 14 days (download them on the run page)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs
          path: logs/
          retention-days: 14
          if-no-files-found: ignore