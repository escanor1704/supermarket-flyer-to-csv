# weekly.yml - the weekly flyer pipeline on GitHub's computers (my PC can be off)
#
# How it works:   Build -> Test -> Deliver   (3 boxes on the run page, each on its own fresh computer)
#   when:     every Sunday 06:07 Berlin time, or the "Run workflow" button
#             (in the button you can type a week number, e.g. 46, to make an older week - only while its flyers are online)
#   Build     get the code, install the packages
#   Test      the quick tests - one fails = stop, nothing is stored
#   Deliver   run.py makes the week's file, the tests check it, then every weekly file it made goes to
#             Backblaze B2 as weekly/offers_<week>.csv (an old file there is replaced, Backblaze keeps the old version)
#   A push of new code only runs Build + Test (Deliver shows as "skipped").
#   The Backblaze keys come from GitHub Secrets (B2_KEY_ID, B2_APP_KEY) - never type them into this file.
#
# Tried and tuned:
#   - it was one big "weekly" box -> split into Build, Test, Deliver, so I can see where it broke
#   - Backblaze said "Seed signature is invalid" -> fixed with the two checksum lines below and a new key without spaces
#   - first it downloaded offers.csv from Backblaze to add to it (403 error) -> now it only stores, one file per week
#   - Lidl came later, but GitHub only makes next week -> the week field in "Run workflow" makes an older week again

name: Weekly flyer pipeline

on:
  schedule:
    - cron: "7 6 * * 0"              # minute 7, hour 6, every Sunday (0)
      timezone: "Europe/Berlin"
  workflow_dispatch:                  # adds the "Run workflow" button
    inputs:
      week:
        description: "Week number to make again, e.g. 46 (leave empty = next week, like on Sunday)"
        required: false
        default: ""
  push:
    branches: [main]

permissions:
  contents: read                      # GitHub only reads your code, nothing is written back

concurrency:
  group: weekly-flyer-pipeline        # never two runs at the same time
  cancel-in-progress: false

jobs:
  # ---------------- BOX 1: BUILD ----------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Python (same version as on your PC)
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the packages
        run: python -m pip install -r requirements.txt "pytest>=9,<10"

  # ---------------- BOX 2: TEST ----------------
  test:
    name: Test
    needs: build                      # starts only if Build worked
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Python (same version as on your PC)
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the packages
        run: python -m pip install -r requirements.txt "pytest>=9,<10"

      - name: Quick tests
        run: python -m pytest -v tests/test_quick.py

  # ---------------- BOX 3: DELIVER ----------------
  deliver:
    name: Deliver
    needs: test                       # starts only if Test worked
    if: github.event_name != 'push'   # not when you only push code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # ----- YOUR VALUES (not secret) -----
      B2_BUCKET: rohith-flyer-offers
      B2_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      AWS_DEFAULT_REGION: us-east-005
      # ----- YOUR KEYS: they come from GitHub Secrets - never type the keys into this file -----
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
      # send files the normal way (Backblaze does not accept the new "chunked" way of the AWS tool)
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Python (same version as on your PC)
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the packages
        run: python -m pip install -r requirements.txt "pytest>=9,<10"

      - name: Make the offers (next week, or the week typed in "Run workflow")
        env:
          WEEK_NUMBER: ${{ inputs.week }}
        run: |
          if [ -z "$WEEK_NUMBER" ]; then
            python run.py                                 # normal: download next week's flyers and make them
          elif [[ "$WEEK_NUMBER" =~ ^[0-9]{1,2}$ ]]; then
            python pipeline/ingest.py "$WEEK_NUMBER" || echo "not every store could be downloaded - going on with the ones that worked"
            python run.py preprocess                      # make only that week (the normal download is skipped)
          else
            echo "Type only the week number, e.g. 46 (you typed: $WEEK_NUMBER)"
            exit 1
          fi

      - name: Test the new weekly files before storing them
        run: python -m pytest -v tests/test_quick.py

      - name: Store the weekly files in Backblaze B2
        run: |
          for file in data/output/offers_*-W*.csv; do      # every weekly file this run made
            aws s3 cp "$file" "s3://$B2_BUCKET/weekly/$(basename "$file")" --endpoint-url "$B2_ENDPOINT"
          done

      - name: Show the quality report on the run page
        if: always()
        run: |
          if [ -f logs/quality_report.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat logs/quality_report.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the log files for 14 days (download them on the run page)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs
          path: logs/
          retention-days: 14
          if-no-files-found: ignore