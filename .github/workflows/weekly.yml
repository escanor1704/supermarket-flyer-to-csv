# Weekly flyer pipeline on GitHub's computers (your PC can be off)
# The run page shows 3 boxes:   Build  ->  Test  ->  Deliver
#   Source  -> every Sunday 06:07 (Berlin time), or the "Run workflow" button
#   Build   -> get the code, install the packages
#   Test    -> quick tests; one fails = stop (nothing is stored)
#   Deliver -> check the Backblaze key, run.py makes this week's offers, test them,
#              store them in Backblaze B2 as weekly/offers_<week>.csv
#   Deploy  -> none yet
# When you push new code, only Build + Test run (Deliver is shown as "skipped").
# Every box runs on its OWN fresh GitHub computer, so each box gets the code and installs the packages.

name: Weekly flyer pipeline

on:
  schedule:
    - cron: "7 6 * * 0"              # minute 7, hour 6, every Sunday (0)
      timezone: "Europe/Berlin"
  workflow_dispatch:                  # adds the "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: read                      # GitHub only reads your code, nothing is written back

concurrency:
  group: weekly-flyer-pipeline        # never two runs at the same time
  cancel-in-progress: false

jobs:
  # ---------------- BOX 1: BUILD ----------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Python (same version as on your PC)
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the packages
        run: python -m pip install -r requirements.txt "pytest>=9,<10"

  # ---------------- BOX 2: TEST ----------------
  test:
    name: Test
    needs: build                      # starts only if Build worked
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Python (same version as on your PC)
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the packages
        run: python -m pip install -r requirements.txt "pytest>=9,<10"

      - name: Quick tests
        run: python -m pytest -v tests/test_quick.py

  # ---------------- BOX 3: DELIVER ----------------
  deliver:
    name: Deliver
    needs: test                       # starts only if Test worked
    if: github.event_name != 'push'   # not when you only push code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # ----- YOUR VALUES (not secret) -----
      B2_BUCKET: rohith-flyer-offers
      B2_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      AWS_DEFAULT_REGION: us-east-005
      # ----- YOUR KEYS: they come from GitHub Secrets - never type the keys into this file -----
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
      # send files the normal way (Backblaze does not accept the new "chunked" way)
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Python (same version as on your PC)
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the packages
        run: python -m pip install -r requirements.txt "pytest>=9,<10"

      - name: Check the Backblaze key
        run: |
          python - <<'EOF'
          import base64, json, os, urllib.request, urllib.error
          key_id = os.environ["AWS_ACCESS_KEY_ID"].strip()          # .strip() removes copied spaces
          app_key = os.environ["AWS_SECRET_ACCESS_KEY"].strip()
          pair = key_id + ":" + app_key
          request = urllib.request.Request(
              "https://api.backblazeb2.com/b2api/v3/b2_authorize_account",
              headers={"Authorization": "Basic " + base64.b64encode(pair.encode()).decode()})
          try:
              answer = json.load(urllib.request.urlopen(request, timeout=30))
          except urllib.error.HTTPError as error:
              print("KEY NOT ACCEPTED by Backblaze:", error.code, error.read().decode()[:200])
              print("-> make a new application key: keyID into B2_KEY_ID, applicationKey into B2_APP_KEY")
              raise SystemExit(1)
          storage = answer.get("apiInfo", {}).get("storageApi", {})
          allowed = storage.get("allowed", {})
          capabilities = allowed.get("capabilities")
          print("Key accepted by Backblaze")
          print("  buckets:     ", [bucket.get("name") for bucket in allowed.get("buckets") or []] or "all buckets")
          print("  capabilities:", capabilities)
          print("  S3 endpoint: ", storage.get("s3ApiUrl"))
          if capabilities is not None and "writeFiles" not in capabilities:
              print("-> this key is NOT allowed to write files - make a new key with Read and Write")
              raise SystemExit(1)
          EOF

      - name: Make this week's offers
        run: python run.py

      - name: Test the new offers before storing them
        run: python -m pytest -v tests/test_quick.py

      - name: Store this week's offers in Backblaze B2
        run: |
          # remove copied spaces / line breaks from the keys (real keys never contain spaces)
          export AWS_ACCESS_KEY_ID="$(echo "$AWS_ACCESS_KEY_ID" | tr -d '[:space:]')"
          export AWS_SECRET_ACCESS_KEY="$(echo "$AWS_SECRET_ACCESS_KEY" | tr -d '[:space:]')"
          WEEK=$(cat data/current_week.txt)
          aws s3 cp data/output/offers.csv "s3://$B2_BUCKET/weekly/offers_$WEEK.csv" --endpoint-url "$B2_ENDPOINT"

      - name: Show the quality report on the run page
        if: always()
        run: |
          if [ -f logs/quality_report.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat logs/quality_report.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the log files for 14 days (download them on the run page)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs
          path: logs/
          retention-days: 14
          if-no-files-found: ignore